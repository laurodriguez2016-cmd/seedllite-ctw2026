<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEEDLLITE — Puntaje de crédito agrícola desde imágenes satelitales</title>
<meta name="description" content="Puntaje de crédito agrícola construido desde 10 años de imágenes satelitales. Hackathon Colombia Tech Week 2026.">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="barra">
  <span class="marca">SEEDLLITE</span>
  <span class="marca-sub">Originación y monitoreo satelital de crédito agropecuario</span>
  <nav class="barra-fin">
    <button class="boton boton-icono" data-nav="mapa">Mapa</button>
    <button class="boton boton-icono" data-nav="cartera">Cartera</button>
    <a class="boton boton-icono" href="#nuevo">Radicar</a>
    <button class="boton boton-icono" id="tema" aria-label="Alternar tema claro y oscuro">◐</button>
  </nav>
</header>

<!--
  PORTADA — el plano de apertura.

  Va en el HTML y no la construye el JavaScript a propósito: así pinta en el
  primer fotograma, sin el parpadeo de un lienzo vacío mientras cargan los
  scripts. 90-app.js la disuelve sola a los 2,2 s, o antes si se hace clic.

  Solo aparece al entrar sin ruta (index.html a secas). Con ruta directa
  —index.html#dictamen/meta-cacao— no se muestra: durante la grabación se salta
  a cualquier toma sin tener que esperarla cada vez.
-->
<div id="portada">
  <div class="portada-cuerpo">
    <p class="portada-marca">SEEDLLITE</p>
    <h1 class="portada-frase">Historial crediticio<br>construido desde el espacio</h1>
    <div class="portada-regla"></div>
    <p class="portada-pie">
      Evaluación de riesgo crediticio agropecuario por análisis satelital
    </p>
  </div>
</div>

<main class="lienzo" id="vista"></main>

<!--
  ORDEN DE CARGA — importa, no hay bundler.
  El prefijo numérico de cada archivo ES su posición en esta lista.

  NO convertir estos scripts en módulos ES ni usar declaraciones de importación:
  quedan sujetos a CORS y NO cargan bajo file://, lo que rompe el requisito de
  abrir con doble clic (constitución V.4). Por la misma razón los datos entran
  por etiqueta <script> y no por petición asíncrona. Ver ARQUITECTURA.md §2.

  Redactado sin las cadenas literales que verificar.sh §3 busca: el guardián
  hacía saltar la alarma con este mismo comentario que lo explica.
-->
<script src="data/datos.js"></script>
<script src="assets/10-mapa.js"></script>
<script src="assets/20-grafica-ndvi.js"></script>
<script src="assets/30-vistas.js"></script>
<script src="assets/40-tooltips.js"></script>
<script src="assets/50-estadistica.js"></script>
<script src="assets/70-nuevo-caso.js"></script>
<script src="assets/90-app.js"></script>

</body>
</html>
